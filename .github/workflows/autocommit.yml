name: Auto Commit Changes

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # Runs at 00:00 UTC daily
    - cron: '0 6 * * *'   # Runs at 06:00 UTC daily
    - cron: '0 12 * * *'  # Runs at 12:00 UTC daily
    - cron: '0 18 * * *'  # Runs at 18:00 UTC daily

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push new commits
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Changes to a File
        run: |
          date > LAST_UPDATED.txt

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: automated file update"
