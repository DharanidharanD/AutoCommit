name: Auto Commit Changes

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight (adjust via crontab.guru)

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push new commits
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Changes to a File
        run: |
          date > LAST_UPDATED.txt

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: automated file update"
